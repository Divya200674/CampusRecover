<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Items Under Review - CampusRecover</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .admin-label {
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 35px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8fafc;
        }

        .status {
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .review {
            background: #fff3cd;
            color: #856404;
        }

        .matched {
            background: #e0e7ff;
            color: #3730a3;
        }

        .review-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .review-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            CampusRecover
        </div>

        <div class="admin-label">
            Admin / Verification Panel
        </div>

    </nav>


    <main class="container">

        <h1>Items Under Review</h1>

        <p class="subtitle">
            Review found items and verify their ownership claims.
        </p>


        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Item ID</th>
                        <th>Item</th>
                        <th>Found By</th>
                        <th>Matched Claim</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>

                </thead>

                

                    <tbody id="itemsTableBody">
    <tr>
        <td colspan="7">Loading items...</td>
    </tr>
</tbody>

                

            </table>

        </div>

    </main>
    <script>
    const API_URL = "http://localhost:3000";

    async function loadItems() {

        const tableBody = document.getElementById("itemsTableBody");

        try {

            const response = await fetch(`${API_URL}/items`);
            const data = await response.json();

            if (!data.success) {
                throw new Error(data.message);
            }

            if (data.items.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7">No items found.</td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = "";

            data.items.forEach(item => {

                const row = document.createElement("tr");

                const statusClass =
                    item.status === "FOUND"
                        ? "matched"
                        : "review";

                row.innerHTML = `
                    <td>${item.itemId}</td>

                    <td>${item.itemName}</td>

                    <td>-</td>

                    <td>-</td>

                    <td>
                        <span class="status ${statusClass}">
                            ${item.status}
                        </span>
                    </td>

                    <td>
                        ${new Date(item.createdAt).toLocaleDateString()}
                    </td>

                    <td>
                        <button class="review-btn"
                            onclick="reviewItem('${item.itemId}')">
                            Review
                        </button>
                    </td>
                `;

                tableBody.appendChild(row);
            });

        } catch (error) {

            console.error(error);

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7">
                        Failed to load items from backend.
                    </td>
                </tr>
            `;
        }
    }


    async function reviewItem(itemId) {

    try {

        const response = await fetch(
            `${API_URL}/claims`
        );

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.message);
        }

        // Find the claim belonging to this item
        const claim = data.claims.find(
            claim => claim.itemId === itemId
        );

        if (!claim) {
            alert("No claim found for this item.");
            return;
        }

        // Open the claim details page
        window.location.href =
            `claim-details.html?claimId=${encodeURIComponent(claim.claimId)}`;

    } catch (error) {

        console.error(error);

        alert("Failed to find the claim for this item.");
    }
}


    loadItems();
</script>

</body>

</html>
