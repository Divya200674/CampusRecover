<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CampusRecover</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            CampusRecover
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="lost-items.html">Lost Items</a>
            <a href="found-items.html">Found Items</a>
            <a href="report-lost.html">Report Lost</a>
            <a href="login.html">Login</a>
        </div>

    </nav>


    <!-- Register Section -->
    <section class="auth-section">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join your campus lost & found community
            </p>


            <form id="registerForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- College Email -->
                <div class="form-group">

                    <label for="email">
                        College Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        required
                    >

                </div>


                <!-- Student ID -->
                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter your student ID"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Register Button -->
                <button type="submit" class="login-btn">
                    Create Account
                </button>

            </form>


            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 CampusRecover | Campus Lost & Found
        </p>

    </footer>


    <script src="js/main.js"></script>

</body>

</html>
