<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - CampusRecover</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <div class="logo">
            <a href="index.html">CampusRecover</a>
        </div>

        <nav class="nav-links">

            <a href="index.html">Home</a>

            <a href="lost-items.html">Lost Items</a>

            <a href="found-items.html">Found Items</a>

            <a href="login.html">Login</a>

        </nav>

    </div>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>
            Register using your campus details.
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Campus Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your campus email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="studentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentId"
                    placeholder="Enter your student ID"
                    required
                >

            </div>


            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <select id="department" required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="CSE">
                        CSE
                    </option>

                    <option value="ECE">
                        ECE
                    </option>

                    <option value="EEE">
                        EEE
                    </option>

                    <option value="MECH">
                        Mechanical
                    </option>

                    <option value="CIVIL">
                        Civil
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit" class="submit-btn">
                Create Account
            </button>

        </form>


        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</main>


<footer class="footer">

    <p>
        © <span class="current-year">2026</span>
        CampusRecover.
    </p>

</footer>


<script src="js/main.js"></script>

</body>

</html>
