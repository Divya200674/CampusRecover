<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lost Items | CampusRecover</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="nav-container">

        <a
            href="index.html"
            class="logo"
        >
            Campus<span>Recover</span>
        </a>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a
                    href="lost-items.html"
                    class="active"
                >
                    Lost Items
                </a>
            </li>

            <li>
                <a href="found-items.html">
                    Found Items
                </a>
            </li>

            <li>
                <a href="my-reports.html">
                    My Reports
                </a>
            </li>

            <li>
                <a href="my-claims.html">
                    My Claims
                </a>
            </li>

        </ul>


        <div class="nav-profile">

            <a
                href="profile.html"
                class="profile-link"
            >
                👤 Profile
            </a>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                Logout
            </button>

        </div>

    </div>

</nav>



<!-- ================= MAIN ================= -->

<main class="listing-page">

    <div class="listing-container">


        <!-- HEADER -->

        <div class="listing-header">

            <div>

                <span class="page-label">
                    CAMPUS LOST & FOUND
                </span>

                <h1>
                    Lost Items
                </h1>

                <p>
                    Browse items reported missing by students on campus.
                </p>

            </div>


            <a
                href="report-lost.html"
                class="header-primary-btn"
            >
                🔍 Report Lost Item
            </a>

        </div>



        <!-- SEARCH -->

        <div class="search-filter-bar">

            <div class="search-box">

                <span>
                    🔎
                </span>

                <input
                    type="text"
                    id="lostSearch"
                    placeholder="Search lost items..."
                >

            </div>


            <select
                id="lostCategoryFilter"
                class="category-filter"
            >

                <option value="">
                    All Categories
                </option>

                <option value="wallet">
                    Wallet
                </option>

                <option value="mobile">
                    Mobile
                </option>

                <option value="laptop">
                    Laptop
                </option>

                <option value="id-card">
                    ID Card
                </option>

                <option value="books">
                    Books
                </option>

                <option value="bag">
                    Bag
                </option>

                <option value="keys">
                    Keys
                </option>

                <option value="electronics">
                    Electronics
                </option>

                <option value="documents">
                    Documents
                </option>

                <option value="other">
                    Other
                </option>

            </select>

        </div>



        <!-- ITEMS -->

        <div
            id="lostItemsContainer"
            class="items-grid"
        >

            <div class="loading-state">

                <div class="loading-spinner"></div>

                <p>
                    Loading lost items...
                </p>

            </div>

        </div>


    </div>

</main>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <p>

        ©
        <span class="current-year"></span>

        CampusRecover.

        Helping campus belongings find their owners.

    </p>

</footer>



<script src="js/main.js"></script>

</body>

</html>
