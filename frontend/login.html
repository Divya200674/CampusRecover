<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CampusRecover</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            CampusRecover
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="lost-items.html">Lost Items</a>
            <a href="found-items.html">Found Items</a>
            <a href="report-lost.html">Report Lost</a>
            <a href="login.html">Login</a>
        </div>

    </nav>


    <!-- Login Section -->
    <section class="auth-section">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to your CampusRecover account
            </p>


            <form id="loginForm">

                <!-- College Email -->
                <div class="form-group">

                    <label for="email">
                        College Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <p class="register-text">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </div>

    </section>


    <footer>

        <p>
            © 2026 CampusRecover | Campus Lost & Found
        </p>

    </footer>


    <script src="js/main.js"></script>

</body>

</html>
