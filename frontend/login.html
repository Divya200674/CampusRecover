<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CampusRecover</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <div class="logo">
            <a href="index.html">CampusRecover</a>
        </div>

        <nav class="nav-links">

            <a href="index.html">Home</a>

            <a href="lost-items.html">Lost Items</a>

            <a href="found-items.html">Found Items</a>

            <a href="register.html">Register</a>

        </nav>

    </div>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>
            Login using your campus account.
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Campus Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your campus email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="submit-btn">
                Login
            </button>

        </form>


        <p class="auth-link">

            Don't have an account?

            <a href="register.html">
                Register here
            </a>

        </p>

    </div>

</main>


<footer class="footer">

    <p>
        © <span class="current-year">2026</span>
        CampusRecover.
    </p>

</footer>


<script src="js/main.js"></script>

</body>

</html>
